<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KHW Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
  <!-- Schriften der „fremden Seiten“ (skins.js): Boulevard, Zeitung, Chat, Feed/Lager -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Playfair+Display:wght@700;900&family=UnifrakturMaguntia&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Nunito:wght@400;700;800&family=IBM+Plex+Mono:wght@400;600&family=Archivo+Black&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/skins.css">
</head>
<body>
  <div class="app">
    <nav class="nav">
      <div class="brand"><img class="logo" src="../img/logos/KHW%20Logo%20W.png" alt="KHW"><div><b>KHW Office</b><small>Knight &amp; Hustler Wrestling</small></div></div>
      <div id="nav-links"></div>
      <div id="nav-foot" class="nav-foot"></div>
    </nav>
    <main class="main">
      <header class="topbar">
        <div id="crumbs" class="crumbs"></div>
        <div class="topbar-r">
          <span id="presence" class="presence"></span>
          <span id="status"></span>
          <div class="search">
            <span class="ms">search</span>
            <input id="search" type="search" placeholder="Wrestler oder Show suchen …" autocomplete="off">
            <div id="search-hits" class="search-hits" hidden></div>
          </div>
          <button id="refresh" class="btn icon" title="Neu aus der Tabelle laden"><span class="ms">refresh</span></button>
          <button class="avatar" id="avatar" title="Knight &amp; Hustler">KH</button>
        </div>
      </header>
      <div id="admin-bar" class="admin-bar" hidden></div>
      <div id="banner" class="banner" hidden></div>
      <div id="page-head" class="page-head"></div>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer">
    <button id="drawer-close" class="btn icon" title="Schließen"><span class="ms">close</span></button>
    <div id="drawer-body"></div>
  </aside>

  <script src="config.js"></script>
  <script src="supabase-config.js"></script>
  <script src="vendor/supabase-2.117.3.js"></script>
  <script src="../data/snapshot.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-select.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/store.js"></script>
  <script src="js/rules/config.js"></script>
  <script src="js/rules/contract.js"></script>
  <script src="js/rules/show.js"></script>
  <script src="js/hype.js"></script>
  <script src="js/model.js"></script>
  <script src="js/views.js"></script>
  <script src="js/contract.js"></script>
  <script src="js/shows.js"></script>
  <script src="js/showend.js"></script>
  <script src="js/injuries.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/storylines.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/seed/idb-vertrag.js"></script>
  <script src="js/seed/idb-verletzungen.js"></script>
  <script src="js/seed/idb-mitarbeiter.js"></script>
  <script src="js/seed/idb-postfach.js"></script>
  <script src="js/idb.js"></script>
  <script src="js/idbmap.js"></script>
  <script src="js/rulebook.js"></script>
  <script src="js/protocol.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/inbox.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
